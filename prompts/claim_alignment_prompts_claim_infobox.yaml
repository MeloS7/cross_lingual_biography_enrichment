  Enrichment choices (only for aligned pairs):
  - None
  - A > B
  - B > A
  - A <> B

  Label definitions:
  - Not Relevant: Claim A and Claim B are about different factual aspects, even if they refer to the same
    person/entity. A factual aspect can be a date, place, occupation, relationship, event, award, work, role,
    quantity, or other biographical fact.
  - Contradicted: Claim A and Claim B are about the same factual aspect, but assert mutually exclusive values
    or states, so they cannot both be true.
  - Aligned: Claim A and Claim B are about the same factual aspect and can both be true. This includes exact
    paraphrases, translation variants, precision differences, and non-conflicting added detail.
  - Enrichment None: Use when both claims contain the same set of atomic facts with no additional details on either side.
  - Enrichment A > B: Use when Claim A includes the factual content of Claim B and adds one or more
    non-conflicting atomic facts, details, qualifiers, dates, locations, quantities, roles, or context.
  - Enrichment B > A: Use when Claim B includes the factual content of Claim A and adds one or more
    non-conflicting atomic facts, details, qualifiers, dates, locations, quantities, roles, or context.
  - Enrichment A <> B: Use when Claim A and Claim B are aligned and non-contradictory, but Claim A contains
    one or more non-conflicting atomic facts missing from Claim B, and Claim B also contains one or more
    non-conflicting atomic facts missing from Claim A.

  Decision process:
  1) Decide Alignment first.
  2) If Alignment is not "Aligned", Enrichment must be an empty string "".
  3) If Alignment is "Aligned", Enrichment must be one of: "None", "A > B", "B > A", "A <> B".
  4) Mandatory bidirectional check before final output:
     - Evaluate once with the original order (A, B), and once with swapped order (B, A).
     - Final decision must be order-consistent: Alignment must stay the same after swapping.
     - For aligned pairs, Enrichment must invert after swapping ("A > B" <-> "B > A"), remain "None",
       or remain "A <> B".
     - If the two directions disagree, re-check atomic facts and resolve the inconsistency before output.
  5) Infobox fields are auxiliary hints only. They were extracted by an LLM and may contain mistakes or omissions.
     If an infobox field conflicts with the claim sentence, prioritize the claim sentence as the primary evidence.

  Boundary guidance:
  - Missing information is not contradiction. Use "Contradicted" only when both claims explicitly assert
    incompatible values for the same factual aspect.
  - Sentence tense alone does not affect the label, unless the claims explicitly assert incompatible temporal
    states or dates/periods.
  - For the same named entities, minor surface-form, wording, paraphrase, or transliteration differences do not
    change facts and should not be treated as factual mismatch: capitalization, translation variants,
    punctuation, spacing, aliases.
  - Different name forms of the same entity do not count as enrichment, including translations,
    transliterations, aliases, full names, middle names, patronymics, original-language names, or
    parenthesized glosses.

  Output format requirements:
